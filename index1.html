  <script>
    // --- Database & Offline Engine ---
    const RAW_QUESTIONS = [
      // Base Handcrafted Questions
      { id:'e1', cat:'تعلم اللغة الإنجليزية', diff:'سهل', q:'ما معنى كلمة "Knowledge" في اللغة الإنجليزية؟', opts:['معرفة / علم', 'جهل', 'شجاعة', 'صحة'], correct:0, hint:'تكتسبها من القراءة.', exp:'Knowledge تعني العلم والمعرفة.' },
      { id:'e2', cat:'تعلم اللغة الإنجليزية', diff:'سهل', q:'ما هو التصريف الماضي البسيط الصحيح للفعل "Go"؟', opts:['Went', 'Goed', 'Gone', 'Going'], correct:0, hint:'فعل غير منتظم شاذ.', exp:'الماضي من Go هو Went.' },
      { id:'e3', cat:'تعلم اللغة الإنجليزية', diff:'متوسط', q:'اختر الأداة المناسبة: "He is ___ honest man."', opts:['an', 'a', 'the', 'some'], correct:0, hint:'حرف h صامت وتلفظ الصوت المتحرك.', exp:'نستخدم an قبل الصوت المتحرك.' },
      { id:'r1', cat:'ألغاز وذكاء', diff:'سهل', q:'ما هو الشيء الذي يمشي بلا أرجل ويبكي بلا عيون؟', opts:['السحاب', 'الرياح', 'النهر', 'القلم'], correct:0, hint:'ينزل منه المطر.', exp:'السحاب يتحرك وينزل منه المطر.' },
      { id:'r2', cat:'ألغاز وذكاء', diff:'سهل', q:'ما هو الشيء الذي كلما أخذت منه كَبُرَ؟', opts:['الحفرة', 'العمر', 'البحر', 'الظل'], correct:0, hint:'تحفره في التراب.', exp:'الحفرة تتسع كلما أخذت منها.' },
      { id:'l1', cat:'اللغة العربية والأدب', diff:'متوسط', q:'من هو الشاعر الملقب بـ "أمير الشعراء"؟', opts:['أحمد شوقي', 'حافظ إبراهيم', 'المتنبي', 'نزار قباني'], correct:0, hint:'شاعر مصري شهير.', exp:'بويع أحمد شوقي أميراً للشعراء.' },
      { id:'c1', cat:'ثقافة عامة وإسلاميات', diff:'سهل', q:'ما هي أطول سورة في القرآن الكريم؟', opts:['سورة البقرة', 'سورة آل عمران', 'سورة النساء', 'سورة الأعراف'], correct:0, hint:'تحتوي على 286 آية.', exp:'سورة البقرة هي أطول سور القرآن.' },
      { id:'m1', cat:'رياضة عقلية وحساب', diff:'سهل', q:'ما هو الحاصل الذهني لـ: (15 × 4) + 10؟', opts:['70', '60', '80', '50'], correct:0, hint:'15 × 4 = 60.', exp:'60 + 10 = 70.' }
    ];

    // Generator for 10,000+ Questions
    const engWords = [
      {w: 'Magnificent', c: 'رائع / بليغ / عظيم', w1: 'صغير', w2: 'بطيء', w3: 'قبيح'},
      {w: 'Perseverance', c: 'المواظبة / المثابرة', w1: 'الاستسلام', w2: 'الكسل', w3: 'الإهمال'},
      {w: 'Extraordinary', c: 'استثنائي / خارق', w1: 'عادي مكرر', w2: 'ضعيف', w3: 'ممل'},
      {w: 'Compassion', c: 'الرحمة / العطف', w1: 'القسوة', w2: 'الغضب', w3: 'الأنانية'},
      {w: 'Resilience', c: 'المرونة / القدرة على التعافي', w1: 'الهشاشة', w2: 'الضعف', w3: 'التراجع'},
      {w: 'Integrity', c: 'النزاهة / الاستقامة', w1: 'الخيانة', w2: 'الاحتيال', w3: 'الضعف'}
    ];
    const riddles = [
      {q: 'ما هو الشيء الذي كلما كبرت نسبته قلَّت رؤيتك له؟', c: 'الظلام', w1: 'الضوء', w2: 'الهواء', w3: 'الصوت'},
      {q: 'شيء يملك عين واحدة ولكنه لا يستطيع الرؤية بها؟', c: 'الإبرة', w1: 'المرآة', w2: 'النظارة', w3: 'القلم'},
      {q: 'أمتلك مدناً بلا بيوت وبحاراً بلا ماء، فمن أنا؟', c: 'الخريطة', w1: 'اللوحة', w2: 'الرواية', w3: 'الحلم'}
    ];
    const arabicWords = [
      {w: 'العسجد', c: 'الذهب الخالص', w1: 'الحديد', w2: 'التراب', w3: 'الصلصال'},
      {w: 'اللجين', c: 'الفضة النقية', w1: 'الذهب', w2: 'الماس', w3: 'النحاس'},
      {w: 'الضرغام', c: 'الأسد الشجاع', w1: 'النمر', w2: 'الفهد', w3: 'الصقر'}
    ];

    for(let i=1; i<=2500; i++) {
      const item = engWords[i % engWords.length];
      RAW_QUESTIONS.push({
        id: 'gen_e_v_' + i, cat: 'تعلم اللغة الإنجليزية', diff: i%3===0?'صعب':i%2===0?'متوسط':'سهل',
        q: 'ما المعنى العربي لكلمة "' + item.w + '"؟',
        opts: [item.c, item.w1, item.w2, item.w3], correct: 0, hint: 'مفردة إنجليزية.', exp: item.w + ' تعني ' + item.c
      });
    }
    for(let i=1; i<=2000; i++) {
      const a = (i * 3) % 40 + 2; const mult = (i % 3) + 2; const b = a * mult; const c = b * mult; const ans = c * mult;
      RAW_QUESTIONS.push({
        id: 'gen_m_' + i, cat: 'رياضة عقلية وحساب', diff: i%3===0?'صعب':'سهل',
        q: 'أكمل متتالية الأعداد: ' + a + '، ' + b + '، ' + c + '، (...)؟',
        opts: [ans.toString(), (ans+mult).toString(), (ans-4).toString(), (ans+10).toString()],
        correct: 0, hint: 'اضرب في ' + mult, exp: c + ' × ' + mult + ' = ' + ans
      });
    }
    for(let i=1; i<=2000; i++) {
      const item = riddles[i % riddles.length];
      RAW_QUESTIONS.push({
        id: 'gen_r_' + i, cat: 'ألغاز وذكاء', diff: i%3===0?'صعب':'متوسط',
        q: item.q,
        opts: [item.c, item.w1, item.w2, item.w3], correct: 0, hint: 'لغز تفكير.', exp: 'الإجابة الصحيحة هي ' + item.c
      });
    }
    for(let i=1; i<=1800; i++) {
      const item = arabicWords[i % arabicWords.length];
      RAW_QUESTIONS.push({
        id: 'gen_a_' + i, cat: 'اللغة العربية والأدب', diff: i%3===0?'صعب':'متوسط',
        q: 'ما معنى الكلمة الفصيحة "' + item.w + '"؟',
        opts: [item.c, item.w1, item.w2, item.w3], correct: 0, hint: 'معاجم اللغة.', exp: item.w + ' تعني ' + item.c
      });
    }
    for(let i=1; i<=2000; i++) {
      RAW_QUESTIONS.push({
        id: 'gen_s_' + i, cat: 'العلوم والتكنولوجيا', diff: i%3===0?'صعب':'سهل',
        q: 'ما هي السرعة التقريبية للضوء في الفراغ؟',
        opts: ['300,000 كم/ثانية', '150,000 كم/ثانية', '500,000 كم/ثانية', '1,000,000 كم/ثانية'], correct: 0, hint: 'أسرع سرعة في الفيزياء.', exp: 'سرعة الضوء تعادل 300 ألف كم/ث.'
      });
    }

    // Tracking array for preventing duplicate questions in exported HTML
    let shownQuestionIds = JSON.parse(localStorage.getItem('exported_shown_ids') || '[]');

    function pickUnseenQuestions(pool, count) {
      if (!pool || pool.length === 0) return [];
      let available = pool.filter(q => !shownQuestionIds.includes(q.id));
      if (available.length < count) {
        const poolIds = pool.map(q => q.id);
        shownQuestionIds = shownQuestionIds.filter(id => !poolIds.includes(id));
        available = [...pool];
      }
      const shuffled = [...available].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, count);
      selected.forEach(q => {
        if (!shownQuestionIds.includes(q.id)) {
          shownQuestionIds.push(q.id);
        }
      });
      try {
        localStorage.setItem('exported_shown_ids', JSON.stringify(shownQuestionIds));
      } catch(e) {}
      return selected;
    }

    // Sound FX Web Audio API
    let soundEnabled = true;
    function playAudioTone(freq, type, duration) {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-txt').innerText = soundEnabled ? 'الصوت: مفعل' : 'الصوت: مكتوم';
    }

    // State Management
    let stats = JSON.parse(localStorage.getItem('quiz_stats') || '{"maxUnlocked":1, "totalScore":0}');
    let currentQuiz = null;
    let timerInterval = null;

    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState({ view: 'home' }, '');
      }
    } catch(e) {}

    window.onpopstate = function() {
      goHome();
    };

    function saveStats() {
      localStorage.setItem('quiz_stats', JSON.stringify(stats));
    }

    // View Routing
    function goHome() {
      if (timerInterval) clearInterval(timerInterval);
      const container = document.getElementById('app-container');
      const maxUnlocked = stats.maxUnlocked || 1;

      container.innerHTML = `
        <div class="space-y-6 animate-pop">
          <!-- Hero Section with Launcher Button -->
          <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 border-2 border-indigo-500/40 p-6 sm:p-8 shadow-2xl space-y-6">
            <div class="space-y-3">
              <h2 class="text-2xl sm:text-4xl font-black text-white">
                تحدي العقول — <span class="text-amber-300">نظام المراحل التفاعلي</span>
              </h2>
              <p class="text-slate-300 text-sm max-w-xl leading-relaxed">
                تتدرج الصعوبة تلقائياً مع كل مرحلة (🟢 سهل، 🟡 متوسط، 🔴 صعب). عند اجتياز أي مرحلة تتفتح المرحلة التالية فوراً.
              </p>
            </div>

            <!-- Start Game Buttons -->
            <div class="flex flex-wrap gap-3">
              <button onclick="startStage(${maxUnlocked})" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-indigo-600 to-emerald-500 text-white font-black text-lg shadow-xl hover:scale-105 active:scale-95 transition cursor-pointer flex items-center gap-3">
                🚀 ابدأ اللعب (المرحلة ${maxUnlocked})
              </button>
            </div>
          </div>

          <!-- Quick Challenge Modes -->
          <div class="space-y-3 pt-2">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              ⚡ أنماط التحدي السريع
            </h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <button onclick="startQuickMode('التحدي اليومي')" class="p-3.5 rounded-2xl bg-slate-900 border border-amber-500/30 hover:border-amber-400 text-right hover:scale-105 transition cursor-pointer space-y-1">
                <span class="text-xl">📅</span>
                <h4 class="font-extrabold text-xs text-amber-300">التحدي اليومي</h4>
                <p class="text-[10px] text-slate-400">10 أسئلة متجددة</p>
              </button>

              <button onclick="startQuickMode('تحدي السرعة')" class="p-3.5 rounded-2xl bg-slate-900 border border-rose-500/30 hover:border-rose-400 text-right hover:scale-105 transition cursor-pointer space-y-1">
                <span class="text-xl">⚡</span>
                <h4 class="font-extrabold text-xs text-rose-300">تحدي السرعة</h4>
                <p class="text-[10px] text-slate-400">10 ثوانٍ لكل سؤال</p>
              </button>

              <button onclick="startQuickMode('أنماط الألغاز')" class="p-3.5 rounded-2xl bg-slate-900 border border-purple-500/30 hover:border-purple-400 text-right hover:scale-105 transition cursor-pointer space-y-1">
                <span class="text-xl">🧩</span>
                <h4 class="font-extrabold text-xs text-purple-300">أنماط الألغاز</h4>
                <p class="text-[10px] text-slate-400">ألغاز تحتاج لذكاء</p>
              </button>

              <button onclick="startQuickMode('وضع التدريب')" class="p-3.5 rounded-2xl bg-slate-900 border border-emerald-500/30 hover:border-emerald-400 text-right hover:scale-105 transition cursor-pointer space-y-1">
                <span class="text-xl">📚</span>
                <h4 class="font-extrabold text-xs text-emerald-300">وضع التدريب</h4>
                <p class="text-[10px] text-slate-400">بدون مؤقت زمني</p>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function startStage(stageNum) {
      playAudioTone(523, 'sine', 0.2);
      const stageQuestions = pickUnseenQuestions(RAW_QUESTIONS, 5);
      setupQuiz(stageQuestions, 'المرحلة ' + stageNum, stageNum);
    }

    function startQuickMode(modeTitle) {
      playAudioTone(587, 'sine', 0.2);
      const questions = pickUnseenQuestions(RAW_QUESTIONS, 5);
      setupQuiz(questions, modeTitle, null);
    }

    function setupQuiz(questionsList, titleName, stageNum) {
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ view: 'quiz' }, '');
        }
      } catch(e) {}
      currentQuiz = {
        title: titleName,
        stageNum: stageNum,
        questions: questionsList,
        currentIndex: 0,
        score: 0,
        answered: false,
        timer: 20
      };
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      if (timerInterval) clearInterval(timerInterval);
      const q = currentQuiz.questions[currentQuiz.currentIndex];
      currentQuiz.answered = false;
      currentQuiz.timer = 20;

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-5 animate-pop">
          <!-- Quiz Header -->
          <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3.5 sm:p-4 rounded-2xl">
            <button onclick="goHome()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 font-bold text-xs flex items-center gap-1 transition cursor-pointer">
              ⬅️ خروج
            </button>
            <div class="text-center">
              <span class="text-xs font-bold text-amber-400">${currentQuiz.title}</span>
              <h3 class="text-base font-black text-white">السؤال ${currentQuiz.currentIndex + 1} من ${currentQuiz.questions.length}</h3>
            </div>
            <div class="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-amber-300 font-extrabold text-sm flex items-center gap-1.5">
              ⏱️ <span id="timer-val">20</span> ثانية
            </div>
          </div>

          <!-- Question Card -->
          <div class="p-6 rounded-3xl bg-slate-900/90 border-2 border-indigo-500/30 shadow-2xl space-y-5">
            <div class="flex items-center justify-between text-xs font-bold">
              <span class="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">${q.cat}</span>
              <span class="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300">${q.diff}</span>
            </div>

            <h2 class="text-lg sm:text-xl font-black text-white leading-relaxed text-center sm:text-right">
              ${q.q}
            </h2>

            <!-- Options Grid -->
            <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              ${q.opts.map((opt, idx) => `
                <button onclick="handleAnswer(${idx})" id="opt-${idx}" class="p-4 rounded-2xl bg-slate-800/80 border-2 border-slate-700/80 hover:border-indigo-500 text-white font-bold text-right transition cursor-pointer active:scale-95 flex items-center justify-between">
                  <span>${opt}</span>
                  <span class="w-7 h-7 rounded-full bg-slate-950 flex items-center justify-center text-xs text-slate-400">${['أ','ب','ج','د'][idx]}</span>
                </button>
              `).join('')}
            </div>

            <!-- Explanation / Hint Box -->
            <div id="exp-box" class="hidden p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-300 space-y-1">
              <p class="font-bold text-amber-400">💡 توضيح المعلومة:</p>
              <p>${q.exp}</p>
            </div>

            <!-- Next Button -->
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-base shadow-lg cursor-pointer">
              السؤال التالي ←
            </button>
          </div>
        </div>
      `;

      // Start Timer
      timerInterval = setInterval(() => {
        currentQuiz.timer--;
        const el = document.getElementById('timer-val');
        if (el) el.innerText = currentQuiz.timer;

        if (currentQuiz.timer <= 0) {
          clearInterval(timerInterval);
          if (!currentQuiz.answered) {
            handleAnswer(-1); // Timeout
          }
        }
      }, 1000);
    }

    function handleAnswer(selectedIdx) {
      if (currentQuiz.answered) return;
      currentQuiz.answered = true;
      if (timerInterval) clearInterval(timerInterval);

      const q = currentQuiz.questions[currentQuiz.currentIndex];
      const isCorrect = selectedIdx === q.correct;

      if (isCorrect) {
        currentQuiz.score++;
        playAudioTone(659, 'triangle', 0.25);
      } else {
        playAudioTone(220, 'sawtooth', 0.3);
      }

      // Highlight options
      q.opts.forEach((_, idx) => {
        const btn = document.getElementById('opt-' + idx);
        if (!btn) return;
        btn.disabled = true;
        if (idx === q.correct) {
          btn.className = 'p-4 rounded-2xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-200 font-bold text-right flex items-center justify-between';
        } else if (idx === selectedIdx) {
          btn.className = 'p-4 rounded-2xl bg-rose-950/80 border-2 border-rose-500 text-rose-200 font-bold text-right flex items-center justify-between';
        } else {
          btn.className = 'p-4 rounded-2xl bg-slate-950 border border-slate-900 text-slate-600 font-bold text-right flex items-center justify-between opacity-50';
        }
      });

      document.getElementById('exp-box').classList.remove('hidden');
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuiz.currentIndex++;
      if (currentQuiz.currentIndex < currentQuiz.questions.length) {
        renderQuizQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const passed = currentQuiz.score >= Math.ceil(currentQuiz.questions.length * 0.6);
      if (passed && currentQuiz.stageNum && currentQuiz.stageNum >= (stats.maxUnlocked || 1)) {
        stats.maxUnlocked = currentQuiz.stageNum + 1;
        saveStats();
        playAudioTone(880, 'sine', 0.4);
      }

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="max-w-md mx-auto p-6 rounded-3xl bg-slate-900 border-2 border-indigo-500/30 text-center space-y-6 animate-pop shadow-2xl">
          <div class="w-20 h-20 mx-auto rounded-full bg-indigo-500/20 border-2 border-indigo-500 flex items-center justify-center text-4xl">
            ${passed ? '🎉' : '💪'}
          </div>

          <div class="space-y-2">
            <h2 class="text-2xl font-black text-white">${passed ? 'احسنت! اجتزت التحدي بنجاح' : 'محاولة جيدة، حاول مجدداً!'}</h2>
            <p class="text-sm text-slate-300">أجبت على ${currentQuiz.score} من إجمالي ${currentQuiz.questions.length} أسئلة بشكل صحيح</p>
          </div>

          <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 grid grid-cols-2 gap-3 text-center">
            <div>
              <p class="text-xs text-slate-400">النتيجة النهائية</p>
              <p class="text-xl font-black text-amber-400">${Math.round((currentQuiz.score / currentQuiz.questions.length) * 100)}%</p>
            </div>
            <div>
              <p class="text-xs text-slate-400">المرحلة المفتوحة</p>
              <p class="text-xl font-black text-emerald-400">${stats.maxUnlocked || 1}</p>
            </div>
          </div>

          <div class="flex flex-col gap-2.5">
            ${passed && currentQuiz.stageNum ? `
              <button onclick="startStage(${currentQuiz.stageNum + 1})" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-lg cursor-pointer">
                المرحلة التالية (${currentQuiz.stageNum + 1}) 🚀
              </button>
            ` : ''}
            <button onclick="goHome()" class="w-full py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm cursor-pointer">
              القائمة الرئيسية
            </button>
          </div>
        </div>
      `;
    }

    // Initialize App
    window.onload = function() {
      goHome();
    };
  </script>
</body>
</html>
